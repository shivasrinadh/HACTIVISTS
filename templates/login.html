<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ClaimWatch AI</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
    <div class="login-shell">
        <button class="dark-mode-toggle" id="darkModeToggle" title="Toggle dark mode">
            <span class="toggle-icon">🌙</span>
        </button>
        <div class="login-box">
            <div class="login-header" style="animation: fadeInUp 0.6s ease-out;">
                <div class="login-logo" style="animation: pulse 3s ease-in-out infinite;"><i class="fas fa-shield-halved"></i></div>
                <h1 style="animation: fadeInUp 0.8s ease-out 0.2s both;">ClaimWatch AI</h1>
            </div>
            <p class="login-subtitle" style="animation: fadeInUp 1s ease-out 0.4s both;">Fraud Detection & Analysis Platform</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="flash flash-{{ category }}">{{ message }}</div>
            {% endfor %}
            {% endif %}
            {% endwith %}

            <form method="post" class="login-form">
                <div class="form-group">
                    <label for="username" class="label-with-icon"><i class="fas fa-user"></i> Username</label>
                    <input id="username" name="username" type="text" placeholder="Enter your username" required>
                </div>
                <div class="form-group">
                    <label for="password" class="label-with-icon"><i class="fas fa-lock"></i> Password</label>
                    <input id="password" name="password" type="password" placeholder="Enter your password" required>
                </div>
                <button class="btn btn-primary btn-login btn-icon" type="submit" title="Sign in"><i class="fas fa-right-to-bracket"></i> Sign In</button>
            </form>
            <p class="login-footer">Don't have an account? <a href="{{ url_for('signup') }}">Sign up here</a></p>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/darkmode.js') }}"></script>
</body>

</html>
